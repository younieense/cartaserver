# /etc/nginx/sites-available/carta
# После certbot проверьте, что location /ws остался в блоке listen 443.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream carta_app {
    server 127.0.0.1:8443;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name nevelinko.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nevelinko.online;

    # Certbot обычно подставляет свои пути; если certbot уже настраивал SSL —
    # оставьте его ssl_certificate* и просто добавьте location / и /ws ниже.
    ssl_certificate     /etc/letsencrypt/live/nevelinko.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nevelinko.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://carta_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # КРИТИЧНО для Android / веб-клиента
    location /ws {
        proxy_pass http://carta_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
