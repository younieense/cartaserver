services:
  server:
    build: .
    environment:
      CARTA_HOST: 0.0.0.0
      CARTA_PORT: 8443
      CARTA_USE_TLS: "0"
      SQLITE_URL: sqlite+aiosqlite:///./data/carta.db
      TZ: Europe/Moscow
    volumes:
      - sqlite_data:/app/data
    ports:
      - "8443:8443"

volumes:
  sqlite_data:
